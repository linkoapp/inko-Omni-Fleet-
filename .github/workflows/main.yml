name: Linko 200-Server Omni-Master Fleet

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      server_id:
        description: 'Enter Server Number (1 to 200)'
        required: true
        default: '1'
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install coincurve bit base58 requests

    - name: Run 200-Server Omni-Master Fleet Node
      run: |
        python linko_200_server_omni_master_fleet.py ${{ github.event.inputs.server_id || '1' }}
